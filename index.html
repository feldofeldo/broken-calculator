
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 50px 20px;
    }
    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { color: #315efb; }
    button {
      background: #315efb;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>It works!</h1>
    <p>My website is running correctly.</p>
    <p>Welcome to the Broken Calculator Lab test.</p>
    <h2 id="number">0</h2>
    <button onclick="addThree()">Add 3</button>
  </div>

  <script>
    let number = 0;
    function addThree() {
      number += 3;
      document.getElementById("number").textContent = number;
    }
  </script>
</body>
</html>
